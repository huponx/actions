name: trivy-scan
description: >-
  Install Trivy (one pinned version for every action) and scan with it. scan-type image: scan a container
  image for known vulnerabilities (CVE) and write a normalised, de-duplicated JSON list (id, package,
  installed and fixed version, severity); reusable on its own or as the input of a comparison between two
  images. scan-type config: report-only misconfiguration scan of a folder (chart, Dockerfile).
inputs:
  scan-type:
    description: image (vulnerabilities of a container image) or config (report-only misconfiguration scan of target).
    required: false
    default: image
  image:
    description: Image reference to scan (scan-type image), for example ghcr.io/owner/app:1.2.3.
    required: false
    default: ""
  target:
    description: Folder to scan (scan-type config), for example a chart or the folder of a Dockerfile.
    required: false
    default: ""
  severity:
    description: Comma separated severities to report.
    required: false
    default: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
  ignore-unfixed:
    description: Hide vulnerabilities that have no fix yet.
    required: false
    default: "false"
  registry-username:
    description: Registry user for a private image (leave empty for a public image).
    required: false
    default: ""
  registry-password:
    description: Registry password or token for a private image, for example secrets.GITHUB_TOKEN for ghcr.io.
    required: false
    default: ""
  trivy-version:
    description: Trivy version to install, a release tag (pinned on purpose, bump it here for every action at once).
    required: false
    default: v0.76.2
  timeout:
    description: Scan timeout.
    required: false
    default: 10m
  output-dir:
    description: Folder for the report files (default is a folder under the runner temp directory).
    required: false
    default: ""
  fail-on-severity:
    description: Comma separated severities that fail the step when present (empty never fails on findings).
    required: false
    default: ""
  ignorefile:
    description: Path of a .trivyignore file (empty = Trivy's default lookup of .trivyignore in the working directory).
    required: false
    default: ""
  sarif:
    description: Also write trivy.sarif (for github/codeql-action/upload-sarif) next to the other reports.
    required: false
    default: "false"
  summary:
    description: Write a severity table to the job summary.
    required: false
    default: "true"
outputs:
  vulnerabilities:
    description: Path of the normalised JSON list.
    value: ${{ steps.scan.outputs.vulnerabilities }}
  report:
    description: Path of the raw Trivy JSON report.
    value: ${{ steps.scan.outputs.report }}
  sarif:
    description: Path of the SARIF report (empty unless the sarif input is true).
    value: ${{ steps.scan.outputs.sarif }}
  total:
    description: Number of vulnerabilities.
    value: ${{ steps.scan.outputs.total }}
  critical:
    description: Number of CRITICAL vulnerabilities.
    value: ${{ steps.scan.outputs.critical }}
  high:
    description: Number of HIGH vulnerabilities.
    value: ${{ steps.scan.outputs.high }}
  medium:
    description: Number of MEDIUM vulnerabilities.
    value: ${{ steps.scan.outputs.medium }}
  low:
    description: Number of LOW vulnerabilities.
    value: ${{ steps.scan.outputs.low }}
  unknown:
    description: Number of UNKNOWN vulnerabilities.
    value: ${{ steps.scan.outputs.unknown }}
runs:
  using: composite
  steps:
    # A job can call this action several times (image scan, Dockerfile scan): install Trivy only once.
    - name: Check for an installed Trivy
      id: have
      shell: bash
      env:
        WANTED: ${{ inputs.trivy-version }}
      run: |
        have=false
        if [ "${WANTED}" != "latest" ] && command -v trivy >/dev/null 2>&1; then
          installed=$(trivy --version 2>/dev/null | sed -n 's/^Version: *//p' | head -n 1)
          [ "${installed#v}" != "${WANTED#v}" ] || have=true
        fi
        echo "have=${have}" >> "${GITHUB_OUTPUT}"

    - name: Install Trivy
      if: steps.have.outputs.have != 'true'
      uses: aquasecurity/setup-trivy@v0.2.6
      with:
        version: ${{ inputs.trivy-version }}
        cache: true

    - name: Check inputs
      shell: bash
      env:
        SCAN_TYPE: ${{ inputs.scan-type }}
        IMAGE: ${{ inputs.image }}
        TARGET: ${{ inputs.target }}
      run: |
        case "${SCAN_TYPE}" in
          image) [ -n "${IMAGE}" ] || { echo "::error::input image is required for scan-type image"; exit 1; } ;;
          config) [ -n "${TARGET}" ] || { echo "::error::input target is required for scan-type config"; exit 1; } ;;
          *) echo "::error::scan-type must be image or config, got '${SCAN_TYPE}'"; exit 1 ;;
        esac

    - name: Misconfiguration scan (report only)
      if: inputs.scan-type == 'config'
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SEVERITY: ${{ inputs.severity }}
        IGNOREFILE: ${{ inputs.ignorefile }}
      run: |
        args=(--quiet --exit-code 0 --severity "${SEVERITY}")
        [ -z "${IGNOREFILE}" ] || args+=(--ignorefile "${IGNOREFILE}")
        {
          echo "### Trivy config: \`${TARGET}\`"
          echo '```'
          trivy config "${args[@]}" "${TARGET}" 2>&1 | tail -n 60
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Scan the image
      if: inputs.scan-type == 'image'
      id: scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SEVERITY: ${{ inputs.severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        TIMEOUT: ${{ inputs.timeout }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        IGNOREFILE: ${{ inputs.ignorefile }}
        SARIF: ${{ inputs.sarif }}
        TRIVY_USERNAME: ${{ inputs.registry-username }}
        TRIVY_PASSWORD: ${{ inputs.registry-password }}
        SCRIPTS: ${{ github.action_path }}/scripts
        TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        dir="${OUTPUT_DIR:-${TEMP_DIR}/trivy-scan}"
        mkdir -p "${dir}"
        args=(image --quiet --scanners vuln --format json --output "${dir}/trivy-raw.json"
              --severity "${SEVERITY}" --timeout "${TIMEOUT}")
        [ "${IGNORE_UNFIXED}" != "true" ] || args+=(--ignore-unfixed)
        [ -z "${IGNOREFILE}" ] || args+=(--ignorefile "${IGNOREFILE}")
        trivy "${args[@]}" "${IMAGE}"
        sarif_file=""
        if [ "${SARIF}" = "true" ]; then
          sarif_file="${dir}/trivy.sarif"
          trivy convert --format sarif --output "${sarif_file}" "${dir}/trivy-raw.json"
        fi
        counts=$(bash "${SCRIPTS}/normalize.sh" "${dir}/trivy-raw.json" "${dir}/vulnerabilities.json")
        {
          echo "vulnerabilities=${dir}/vulnerabilities.json"
          echo "report=${dir}/trivy-raw.json"
          echo "sarif=${sarif_file}"
          echo "${counts}"
        } >> "${GITHUB_OUTPUT}"
        echo "${counts}"

    - name: Job summary
      if: inputs.scan-type == 'image' && inputs.summary == 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TOTAL: ${{ steps.scan.outputs.total }}
        CRITICAL: ${{ steps.scan.outputs.critical }}
        HIGH: ${{ steps.scan.outputs.high }}
        MEDIUM: ${{ steps.scan.outputs.medium }}
        LOW: ${{ steps.scan.outputs.low }}
        UNKNOWN: ${{ steps.scan.outputs.unknown }}
      run: |
        {
          echo "### Trivy: \`${IMAGE}\`"
          echo
          echo "| Critical | High | Medium | Low | Unknown | Total |"
          echo "|---:|---:|---:|---:|---:|---:|"
          echo "| ${CRITICAL} | ${HIGH} | ${MEDIUM} | ${LOW} | ${UNKNOWN} | ${TOTAL} |"
          echo
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Fail on severity
      if: inputs.scan-type == 'image' && inputs.fail-on-severity != ''
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on-severity }}
        FILE: ${{ steps.scan.outputs.vulnerabilities }}
      run: |
        set -euo pipefail
        n=$(jq --arg s "${FAIL_ON}" '($s | split(",") | map(ascii_upcase | gsub(" "; ""))) as $f
              | map(select(.severity as $v | $f | index($v))) | length' "${FILE}")
        if [ "${n}" -gt 0 ]; then
          echo "::error::${n} vulnerability(ies) with severity ${FAIL_ON}"
          exit 1
        fi
