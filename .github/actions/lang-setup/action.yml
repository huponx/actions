name: lang-setup
description: Install the toolchain (and dependency caches) needed to compile one language project.
inputs:
  lang:
    description: go | java | scala | rust | ts | node
    required: true
  root:
    description: Directory of the language project (pom.xml, build.sbt, Cargo.toml). Used for cache keys.
    required: false
    default: "."
  go-version:
    description: Go version (go.mod may ask for a newer patch; GOTOOLCHAIN=auto fetches it)
    required: false
    default: "1.26"
  java-version:
    description: JDK version for java and scala
    required: false
    default: "17"
  node-version:
    description: Node.js version (pnpm comes from the packageManager field of package.json)
    required: false
    default: "20"
  registry-token:
    description: Token with read:packages for npm.pkg.github.com (the node language), exported as NODE_AUTH_TOKEN
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - if: inputs.lang == 'go'
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - if: inputs.lang == 'java'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        cache-dependency-path: ${{ inputs.root }}/pom.xml

    - if: inputs.lang == 'scala'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: sbt
        cache-dependency-path: |
          ${{ inputs.root }}/build.sbt
          ${{ inputs.root }}/project/build.properties

    - if: inputs.lang == 'scala'
      uses: sbt/setup-sbt@v1

    - if: inputs.lang == 'rust'
      uses: dtolnay/rust-toolchain@stable

    - if: inputs.lang == 'rust'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.root }}

    # ts: the protogen TypeScript package (permission constants). Node compiles it; Go builds the generator
    # (protos/tools/protoc-gen-ts-permissions) that scripts/generate.sh runs.
    - if: inputs.lang == 'ts'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}

    - if: inputs.lang == 'ts'
      uses: actions/setup-go@v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - if: inputs.lang == 'node'
      uses: pnpm/action-setup@v5

    # @huponx packages (protogen ts) come from GitHub Packages; web/.npmrc reads NODE_AUTH_TOKEN
    - if: inputs.lang == 'node'
      shell: bash
      env:
        TOKEN: ${{ inputs.registry-token }}
      run: echo "NODE_AUTH_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

    - if: inputs.lang == 'node'
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.root }}/pnpm-lock.yaml
