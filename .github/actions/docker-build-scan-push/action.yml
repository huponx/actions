name: docker-build-scan-push
description: >-
  Build an amd64 image with buildx (loaded locally), scan it with Trivy, and push it to
  ghcr.io/<owner>/<image>:<version> only when the scan passes and push is true.
inputs:
  image-name:
    description: Image name below ghcr.io/<owner>.
    required: true
  version:
    description: Image tag.
    required: true
  dockerfile:
    description: Dockerfile path.
    required: true
  context:
    description: Build context.
    required: false
    default: .
  push:
    description: Push the image after a passing scan.
    required: false
    default: "false"
  owner:
    description: Registry owner (default is the repository owner).
    required: false
    default: ""
  github-token:
    description: Token with packages write for ghcr.io.
    required: true
  severity:
    description: Comma separated severities scanned (and, with fail-on-vulnerabilities, blocking).
    required: false
    default: HIGH,CRITICAL
  ignore-unfixed:
    description: Hide vulnerabilities without a fix.
    required: false
    default: "true"
  fail-on-vulnerabilities:
    description: Fail (and do not push) when the scan finds a vulnerability of the given severities.
    required: false
    default: "true"
  trivyignore:
    description: Path of a .trivyignore file (empty = default lookup).
    required: false
    default: ""
  sarif:
    description: Upload the SARIF report to code scanning (needs security-events write and code scanning enabled).
    required: false
    default: "false"
  comment:
    description: Post or update a sticky pull request comment that lists the CVEs of the image (needs pull-requests write; skipped on forks and outside pull requests).
    required: false
    default: "false"
  build-args:
    description: Extra build arguments, one KEY=VALUE per line (VERSION and REVISION are always set).
    required: false
    default: ""
outputs:
  image:
    description: Full image reference ghcr.io/<owner>/<image>:<version>.
    value: ${{ steps.ref.outputs.image }}
  pushed:
    description: true when the image was pushed.
    value: ${{ steps.push.outputs.pushed }}
  vulnerabilities:
    description: Number of vulnerabilities found.
    value: ${{ steps.scan.outputs.total }}
runs:
  using: composite
  steps:
    - name: Image reference
      id: ref
      shell: bash
      env:
        OWNER_INPUT: ${{ inputs.owner }}
        REPO_OWNER: ${{ github.repository_owner }}
        IMAGE_NAME: ${{ inputs.image-name }}
        VERSION: ${{ inputs.version }}
      run: |
        owner="${OWNER_INPUT:-${REPO_OWNER}}"
        echo "image=ghcr.io/${owner,,}/${IMAGE_NAME}:${VERSION}" >> "${GITHUB_OUTPUT}"

    - uses: docker/setup-buildx-action@v4

    - name: Build (amd64, loaded into the local daemon)
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        load: true
        push: false
        tags: ${{ steps.ref.outputs.image }}
        build-args: |
          VERSION=${{ inputs.version }}
          REVISION=${{ github.sha }}
          ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.image-name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}

    - name: Scan the image
      id: scan
      uses: huponx/actions/.github/actions/trivy-scan@v1
      with:
        image: ${{ steps.ref.outputs.image }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        fail-on-severity: ${{ inputs.fail-on-vulnerabilities == 'true' && inputs.severity || '' }}
        ignorefile: ${{ inputs.trivyignore }}
        sarif: ${{ inputs.sarif }}

    # always(): the comment is also wanted when the scan gate fails the step above.
    - name: Build the CVE comment
      id: cve-comment
      if: always() && inputs.comment == 'true' && steps.scan.outputs.vulnerabilities != ''
      shell: bash
      env:
        VULNS: ${{ steps.scan.outputs.vulnerabilities }}
        IMAGE_NAME: ${{ inputs.image-name }}
        IMAGE: ${{ steps.ref.outputs.image }}
        BODY: ${{ runner.temp }}/cve-comment-${{ inputs.image-name }}.md
        SCRIPTS: ${{ github.action_path }}/scripts
      run: |
        set -euo pipefail
        bash "${SCRIPTS}/cve-comment.sh" "${VULNS}" "${IMAGE_NAME}" "${IMAGE}" "${BODY}"
        echo "body=${BODY}" >> "${GITHUB_OUTPUT}"

    - name: Comment the CVEs on the pull request
      if: always() && steps.cve-comment.outputs.body != ''
      uses: huponx/actions/.github/actions/pr-comment@v1
      with:
        body-file: ${{ steps.cve-comment.outputs.body }}
        marker: "<!-- trivy-image:${{ inputs.image-name }} -->"
        github-token: ${{ inputs.github-token }}

    - name: Upload the SARIF report
      if: always() && inputs.sarif == 'true' && steps.scan.outputs.sarif != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: trivy-${{ inputs.image-name }}

    - name: Dockerfile misconfiguration scan (report only)
      if: always()
      continue-on-error: true
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        SEVERITY: ${{ inputs.severity }}
      run: |
        {
          echo "### Trivy config: \`${DOCKERFILE}\`"
          echo '```'
          trivy config --quiet --exit-code 0 --severity "${SEVERITY}" "$(dirname "${DOCKERFILE}")" 2>&1 | tail -n 40
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Login to ghcr.io
      if: inputs.push == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Push
      id: push
      shell: bash
      env:
        PUSH: ${{ inputs.push }}
        IMAGE: ${{ steps.ref.outputs.image }}
      run: |
        set -euo pipefail
        if [ "${PUSH}" = "true" ]; then
          docker push "${IMAGE}"
          echo "pushed=true" >> "${GITHUB_OUTPUT}"
        else
          echo "pushed=false" >> "${GITHUB_OUTPUT}"
        fi
